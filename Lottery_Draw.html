<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Draw</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="text-center mt-5">

    <h2>Lottery Draw</h2>
    <button class="btn btn-primary mt-3" onclick="drawWinner()">Select Winner</button>

    <h3 id="winner" class="mt-4"></h3>

    <!-- Bootstrap Modal -->
    <div class="modal fade" id="winnerModal" tabindex="-1" aria-labelledby="winnerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="winnerModalLabel">Lottery Winner</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Winner -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Array of lottery ticket numbers
        const tickets = [101, 202, 303, 404, 505, 606, 707];
        document.getElementById("winner").style.color = "red";
        
        function drawWinner() {
            // Select a random ticket
            const randomIndex = Math.floor(Math.random() * tickets.length);
            const winner = tickets[randomIndex];

            // console
            console.log("The winning ticket is:", winner);
            // html page 
            document.getElementById("winner").innerText = "Winner: " + winner;

            // Show inside Bootstrap modal
            document.getElementById("modalBody").innerHTML = `<h4 class="text-center text-success"> Winner: ${winner}</h4>`;

            // Show the modal
            const modal = new bootstrap.Modal(document.getElementById('winnerModal'));
            modal.show();
        }
    </script>

</body>
</html>
