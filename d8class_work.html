<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store Calculator</title>
</head>
<body>
    <h2>Grocery Store Calculator</h2>

    <script>
        let purchaseCount = 0;
        let grandTotal = 0; // to store total of all 5 purchases

        while (purchaseCount < 5) {
            let code = parseInt(prompt("Enter product code (1-3):\n1. Apple (₹30)\n2. Banana (₹10)\n3. Mango (₹50)"));
            let quantity = parseInt(prompt("Enter quantity:"));

            let total = 0;

            switch (code) {
                case 1:
                    total = 30 * quantity;
                    break;
                case 2:
                    total = 10 * quantity;
                    break;
                case 3:
                    total = 50 * quantity;
                    break;
                default:
                    alert("Invalid product code! Skipping this entry.");
                    continue; 
            }

            // Add current total to grand total
            grandTotal += total;

            purchaseCount++;
        }

        // Show final total after all purchases
        alert(`Total amount for 5 purchases: ₹${grandTotal}`);
    </script>
</body>
</html>
