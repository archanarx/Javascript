<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Message Handler</title>
</head>
<body>
    <h2>User Message Handler</h2>

    <script>
        // JSON string containing user information
        const userJSON = '{"name": "Alice", "email": "anita@example.com", "message": "Hello, I like your website!"}';

        // Named arrow function to handle and print message
        const displayMessage = () => {
            try {
                // Convert JSON text into a JavaScript object
                const userData = JSON.parse(userJSON);

                // Print success message to console
                console.log(`Message received from ${userData.name}`);
            } 
            catch (error) {
                // Handle invalid JSON or any error
                console.error("Error: Invalid JSON data!", error);
            }
        };

        // Run the function
        displayMessage();
    </script>
</body>
</html>
